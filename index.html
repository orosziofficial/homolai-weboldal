<script>
    services = [
        { 'service-id': 'inspection', 'service-icon': 'assets/inspection-icon.png', 'title': 'svc_inspection_t', 'desc': 'svc_inspection_d' },
        { 'service-id': 'project-management', 'service-icon': 'assets/project-management-icon.png', 'title': 'svc_pm_t', 'desc': 'svc_pm_d' },
        { 'service-id': 'consulting', 'service-icon': 'assets/consulting-icon.png', 'title': 'svc_consulting_t', 'desc': 'svc_consulting_d' },
        { 'service-id': 'property-assessment', 'service-icon': 'assets/plan-review-icon.png', 'title': 'svc_assess_t', 'desc': 'svc_assess_d' }
    ]


    function renderServices() {
        const servicesContainer = document.getElementById('services-container');
        servicesContainer.innerHTML = '';
        services.forEach(service => {
            const serviceCard = document.createElement('div');
            serviceCard.className = 'col-md-6';
            serviceCard.innerHTML = `
            <div class="service-card" id="service-${service['service-id']}">
                <div class="service-icon">
                    <img src="${service['service-icon']}" alt="${tr(service.title)}" width="80" height="80">
                </div>
                <h4 class="service-title">${tr(service.title)}</h4>
              </div>
        `;
            servicesContainer.appendChild(serviceCard);
        });
    }
    window.addEventListener('load', renderServices);
    document.addEventListener('langchange', renderServices);

    addEventListener('click', function (event) {
        if (event.target.closest('.service-card')) {
            openModal(event.target.closest('.service-card').id.replace('service-', ''));
        }
    });

    function openModal(serviceID) {
        const s = services.find(service => service['service-id'] === serviceID);
        const modal = document.getElementById('serviceModal');
        document.getElementById('serviceModalBody').innerHTML = `
    <h4 class="service-title">${tr(s.title)}</h4>
    <img src="${s['service-icon']}" alt="${tr(s.title)}" width="80" height="80">
    <p>${tr(s.desc)}</p>
    `;
        bootstrap.Modal.getOrCreateInstance(modal).show();
    }


</script>

<div id="serviceModal" class="modal fade" tabindex="-1" aria-labelledby="serviceModalLabel" aria-hidden="true">
