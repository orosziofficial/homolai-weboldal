<script>

    const refbase = [
        { id: 1, k: 'r1', place: 'Gödöllő', size: '271', service: 'r_supervision', images: ['images/godollo_1.jpg', 'images/godollo_2.jpg'] },
        { id: 2, k: 'r2', place: 'Pomáz', size: '211', service: 'r_supervision', images: ['images/pomaz_1.jpg', 'images/pomaz_2.jpg'] },
        { id: 3, k: 'r3', place: 'Budapest', size: '148', service: 'r_supervision', images: ['images/haz_bp_1.jpg', 'images/haz_bp_2.jpg'] },
        { id: 4, k: 'r4', place: 'Üröm', size: '197', service: 'r_supervision', images: ['images/urom_1.jpg', 'images/urom_2.jpg'] },
        { id: 7, k: 'r7', place: 'Üröm', size: '232', service: 'r_supervision', images: ['images/urom2_1.jpg', 'images/urom2_2.jpg', 'images/urom2_3.jpg', 'images/urom2_4.jpg', 'images/urom2_5.jpg', 'images/urom2_6.jpg'] },
        { id: 5, k: 'r5', place: 'Balatonföldvár', size: '215', service: 'r_supervision', images: ['images/nyaralo_1.jpg', 'images/nyaralo_2.jpg', 'images/nyaralo_3.jpg', 'images/nyaralo_4.jpg', 'images/nyaralo_5.jpg'] },
        { id: 8, k: 'r8', place: 'Piliscsaba', size: '98', service: 'r_supervision', images: ['images/piliscsaba_1.jpg', 'images/piliscsaba_2.jpg', 'images/piliscsaba_3.jpg', 'images/piliscsaba_4.jpg'] },
        { id: 6, k: 'r6', place: 'Budapest', size: '78', service: 'r_delivery', images: ['images/lakas_bp_1.jpg', 'images/lakas_bp_2.jpg', 'images/lakas_bp_3.jpg'] }
    ];
    function refData(id) {
        const r = refbase.find(x => x.id === id);
        const desc = r.size
            ? `${tr('r_place')}: ${r.place} &middot; ${tr('r_type')}: ${tr('r_residential')} &middot; ${tr('r_size')}: ${r.size} m<sup>2</sup> &middot; ${tr('r_service')}: ${tr(r.service)}`
            : r.place;
        return { title: tr(r.k), subtitle: r.place, description: desc, images: r.images };
    }

    document.querySelectorAll('.ref').forEach(element => {
        element.addEventListener('click', function(event) {
            event.preventDefault();
            const refId = parseInt(this.getAttribute('data-id'));
            openGallery(refId);
        });
        element.addEventListener('mouseenter', function() {
            this.style.cursor = 'pointer';
            const refId = parseInt(this.getAttribute('data-id'));
            showHint(refId);
        });
        element.addEventListener('mouseleave', function() {
            this.style.cursor = 'default';
            const refId = parseInt(this.getAttribute('data-id'));
            const hintElement = document.querySelector(`.ref-hint`);
            if (hintElement) {
                hintElement.remove();
            }
        });
           
    });


      // show hint image bottom right corner of the image when mouse hovers over the image
      function showHint(refId) {
        const rd = refData(refId);
        if (rd) {
            const hintElement = document.createElement('div');
            const refElement = document.querySelector(`.ref[data-id="${refId}"]`);
            hintElement.className = 'ref-hint';
            hintElement.innerHTML = `<strong>${rd.title} - ${rd.subtitle}</strong>`;
            refElement.appendChild(hintElement);

            // Position the hint near the bottom right corner of the image
           
            const rect = refElement.getBoundingClientRect();

            
            

            // Remove the hint when the mouse leaves the element
            refElement.addEventListener('mouseleave', function() {
                hintElement.remove();
            });
        }
    }
function openGallery(refId) {
    const rd = refData(refId);
    if (rd) {
        const gallery = GLightbox({
            elements: rd.images.map((image, index) => ({
                href: image,
                title: `<b>${rd.title}</b> <br> ${rd.description}`,
                description: ''
            }))
        });
        gallery.open();
    }
}
